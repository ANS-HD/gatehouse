services:
  api:
    build: ./server
    env_file: .env
    restart: unless-stopped
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"

volumes:
  gateway-data:
