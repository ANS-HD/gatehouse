name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatehouse-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to RackNerd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hhd-ans.com/
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      LOCAL_HEALTH_URL: ${{ vars.LOCAL_HEALTH_URL || 'http://127.0.0.1:8080/health' }}
      PUBLIC_HEALTH_URL: https://hhd-ans.com/health

    steps:
      - name: Validate deployment settings
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_PORT VPS_DEPLOY_PATH LOCAL_HEALTH_URL VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production secret or variable: $name" >&2
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid VPS_HOST." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid VPS_USER." >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid VPS_PORT." >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid VPS_DEPLOY_PATH." >&2; exit 1; }
          [[ "$LOCAL_HEALTH_URL" =~ ^http://127\.0\.0\.1:[0-9]+/health$ ]] || {
            echo "LOCAL_HEALTH_URL must be a loopback /health URL." >&2
            exit 1
          }

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/gatehouse_deploy"
          chmod 600 "$HOME/.ssh/gatehouse_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          known_host=$VPS_HOST
          if [[ "$VPS_PORT" != "22" ]]; then
            known_host="[$VPS_HOST]:$VPS_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "VPS_KNOWN_HOSTS has no entry for $known_host." >&2
            exit 1
          }

      - name: Back up and deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/gatehouse_deploy" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_DEPLOY_PATH" "$LOCAL_HEALTH_URL" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          deploy_path=$1
          local_health_url=$2
          expected_sha=$3

          cd -- "$deploy_path"

          if [[ "$(git branch --show-current)" != "master" ]]; then
            echo "Deployment checkout must be on master." >&2
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Deployment checkout contains tracked changes; refusing to overwrite them." >&2
            exit 1
          fi

          ./deploy/backup.sh
          git fetch --prune origin master
          git merge --ff-only origin/master

          if [[ "$(git rev-parse HEAD)" != "$expected_sha" ]]; then
            echo "Server checkout does not match the triggering commit." >&2
            exit 1
          fi

          docker compose config --quiet
          docker compose up -d --build

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "$local_health_url" >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done

          docker compose ps
          echo "Local health check failed: $local_health_url" >&2
          exit 1
          REMOTE

      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "$PUBLIC_HEALTH_URL"
