[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatehouse-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
